[package]
name = "bevy_bhtn"
version = "0.1.0"
edition = "2021"
description = "Hierarchical Task Network planner for Bevy AI — imports .htn files, strongly-typed reflection-driven operators, forward (+MTR) and backward (goal-state) planning."

[dependencies]
bevy_reflect = "0.18"
bevy_asset = "0.18"
serde = { version = "1", features = ["derive"] }
pest = "2"
pest_derive = "2"
thiserror = "2"
ustr = "1.1.0"

[dev-dependencies]
bevy_ecs = { version = "0.18", features = ["multi_threaded"] }
criterion = "0.7"

[[bench]]
name = "ai_throughput"
harness = false

[[bench]]
name = "deep_ai"
harness = false

[[bench]]
name = "lookahead"
harness = false

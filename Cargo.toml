[package]
name = "bevy_bhtn"
version = "0.2.0"
edition = "2021"
description = "Hierarchical Task Network planner for Bevy AI — tasks are plain Rust functions baked into a flat inspectable graph; preconditions/effects are component closures; forward (+MTR) and backward planning."

[dependencies]
bevy_ecs = "0.18"
smallvec = "1"
thiserror = "2"
ustr = "1.1.0"

[dev-dependencies]
bevy_ecs = { version = "0.18", features = ["multi_threaded"] }
criterion = "0.7"

[[bench]]
name = "ai_throughput"
harness = false

[[bench]]
name = "deep_ai"
harness = false

[[bench]]
name = "lookahead"
harness = false

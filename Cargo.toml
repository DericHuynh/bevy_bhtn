[package]
name = "bevy_bhtn"
version = "0.2.0"
edition = "2021"
description = "Hierarchical Task Network planner for Bevy AI — tasks are plain Rust functions baked into a flat inspectable graph; preconditions/effects are component closures; forward (+MTR) and backward planning."

[dependencies]
bevy_ecs = "0.18"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
smallvec = "1"
thiserror = "2"
ustr = "1.1.0"

[features]
# Serialization of compiled plans (the save-game seam: an agent's AI state is
# its `Plan` — plain data). `ustr/serde` interns the display names the plan
# deliberately does not store.
serde = ["dep:serde", "dep:serde_json", "ustr/serde"]
# Hot-reload support via Dioxus Subsecond (the same engine behind Bevy's
# `hotpatching` feature): when enabled, `HtnConfig` can carry a domain
# rebuild closure and the driver re-records + re-bakes the domain whenever a
# hot patch lands. See `src/ecs.rs` module docs.
hotpatching = ["bevy_ecs/hotpatching"]

[dev-dependencies]
# Minimal-feature umbrella: bevy_bae's `tasks!` macro expands to
# `::bevy::prelude::related!`, so the `bevy` crate must be in scope. Default
# features stay off — only app/ecs (the same bevy_ecs 0.18 we use) compile.
bevy = { version = "0.18", default-features = false }
bevy_app = "0.18"
bevy_bae = "0.1"
bevy_ecs = { version = "0.18", features = ["multi_threaded"] }
criterion = "0.7"

[[bench]]
name = "ai_throughput"
harness = false

[[bench]]
name = "deep_ai"
harness = false

[[bench]]
name = "lookahead"
harness = false

[[bench]]
name = "wide_sets"
harness = false

[[bench]]
name = "competitor_comparison"
harness = false
